# Configuration file for AI Recommendations module

# Processing mode: 0=Light, 1=Standard, 2=Deep
ai-recommender-processing-mode=1

# Maximum memory usage in MB
ai-recommender-max-memory=512

# Analyze subtitles for content understanding
ai-recommender-analyze-subtitles=true

# Library scan interval in minutes
ai-recommender-scan-interval=60

# Number of recommendations to display
ai-recommender-num-recommendations=10